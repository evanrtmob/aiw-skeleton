services:
  nginx:
    ports:
      - "50080:80"
    volumes:
      - ./nginx/conf.d/default.dev.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      target: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  backend:
    build:
      target: development
    volumes:
      - ./backend/scr:/code/scr
      - ./backend/dist:/code/dist
      - backend_node_modules:/code/node_modules
    environment:
      NODE_ENV: development
    ports:
      - "53000:3001"

volumes:
  frontend_node_modules:
  backend_node_modules: