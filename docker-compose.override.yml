services:
  nginx:
    ports:
      - "50080:80"
    volumes:
      - ./nginx/conf.d/default.dev.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      target: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  backend:
    build:
      target: development
    volumes:
      - ./backend/scr:/code/scr
      - ./backend/config.cfg:/code/app/config.cfg
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "53000:3001"

volumes:
  frontend_node_modules: